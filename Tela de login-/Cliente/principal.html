<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js"></script>
</head>
<body onload="verificaLogin()" onload="buscarNotas()">
    <div id="INFO"></div>

    <script>
        // Recupera o id do usuário armazenado
        const userId = sessionStorage.getItem("id");

        // Exibe o ID do Usuário, se disponível
        if (userId) {
            document.getElementById("INFO").innerHTML = `<p>ID do Usuário: ${userId}</p>`;
        } else {
            document.getElementById("INFO").innerHTML = "<p>Usuário não encontrado.</p>";
        }
    </script>

<!-- Lista aninhada -->

</body>
</html>
