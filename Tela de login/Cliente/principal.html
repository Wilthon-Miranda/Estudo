<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // Verifica se o usuário está logado
        if (!localStorage.getItem("isLoggedIn")) {
            // Se não estiver, redireciona para a tela de login
            window.location.href = "login.html";
        }
    </script>
</head>
<body>
    <div id="INFO"></div>

    <script>
        // Recupera o id do usuário armazenado
        const userId = localStorage.getItem("id");

        // Exibe o ID do Usuário, se disponível
        if (userId) {
            document.getElementById("INFO").innerHTML = `<p>ID do Usuário: ${userId}</p>`;
        } else {
            document.getElementById("INFO").innerHTML = "<p>Usuário não encontrado.</p>";
        }
    </script>
</body>
</html>
